[dmenu]
dmenu_command = wmenu -i -f "PP Right Grotesk Mono 10" -N "#000000" -n "#C1C1C1" -M "#79241F" -m "#000000" -S "#79241F" -s "#000000"
active_chars = ==
highlight = True
highlight_fg =
highlight_bg =
highlight_bold = True
compact = True
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s} {icon:>4}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = False
obscure_color = #222222

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = foot
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 1
