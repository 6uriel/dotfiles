set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g escape-time 0
set -g set-clipboard on
set -g focus-events on
set -g allow-passthrough on
set -g renumber-windows on   
set -g repeat-time 1000
set -g mouse

set -g base-index 1
set -g pane-base-index 1

unbind C-b
set -g prefix C-SPACE

# vi like selection
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "fg=terminal,bg=terminal"
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g window-status-current-style "fg=colour255,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=colour240]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=colour240]#[default]"
set -g window-status-current-format "#[fg=colour252]#[default] #I:#W#{?window_flags,#{window_flags},} #[fg=colour252]#[default]"
set -g pane-border-style "fg=black,bright"
set -g pane-active-border-style "fg=colour255"
set -g pane-border-lines single
set -g status-interval 5
set -g status-left ""
set -g status-right ""

bind r source-file "~/.config/tmux/tmux.conf"
bind b set -g status
bind Q kill-window
bind q kill-pane
bind-key -n M-BSpace send-keys C-w
bind g neww -n "git" -S lazygit
bind y neww -n "yazi" -S yazi
bind E show-environment -g
bind x split-window -h
bind v split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
